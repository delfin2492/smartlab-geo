name: Build SmartLab-GEO React APK & Deploy Web PWA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-react-apk-and-pwa:
    name: Build React PWA & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build React PWA
        working-directory: ./smartlab-geo
        run: |
          npm install
          npm run build

      - name: Wrap React PWA into Native Android App + Home Screen Widget (Capacitor)
        working-directory: ./smartlab-geo
        run: |
          npm install @capacitor/core@^6.1.2 @capacitor/cli@^6.1.2 @capacitor/android@^6.1.2
          npx cap add android
          npx cap sync android
          python3 scripts/inject_android_widget.py
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p /tmp/apk_release
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/apk_release/SmartLab-GEO.apk

      - name: Upload SmartLab-GEO.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartLab-GEO-APK
          path: /tmp/apk_release/SmartLab-GEO.apk

      - name: Publish Direct APK to GitHub Releases (No ZIP required)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: SmartLab-GEO Mobile App (React PWA + Android Widget)
          body: |
            Klik file **SmartLab-GEO.apk** di bawah ini langsung dari HP Android Anda untuk meng-install aplikasi **SmartLab-GEO** (tanpa perlu ekstrak ZIP), lengkap dengan fitur **Tombol Widget Buka Pintu di Layar Depan HP**.
          files: /tmp/apk_release/SmartLab-GEO.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
