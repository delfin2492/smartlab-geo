name: Build & Deploy SmartLab-GEO React PWA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build React PWA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build React PWA
        working-directory: ./smartlab-geo
        run: |
          npm install
          npm run build

      - name: Upload Built Web App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartLab-GEO-Web-PWA
          path: ./smartlab-geo/dist
