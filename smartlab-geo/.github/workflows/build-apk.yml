name: Build SmartLab-GEO Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Flutter Native Project & Inject Home Screen Widget
        shell: bash
        run: |
          set -e
          if [ -d "smartlab-geo" ]; then
            cd smartlab-geo
          fi

          mkdir -p /tmp/smartlab_backup
          cp -r pubspec.yaml lib android /tmp/smartlab_backup/

          flutter create --org com.smartlab --project-name smartlab_geo --platforms=android,ios .

          cp -r /tmp/smartlab_backup/pubspec.yaml .
          cp -r /tmp/smartlab_backup/lib/* lib/
          cp -r /tmp/smartlab_backup/android/* android/

          python3 - << 'EOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1,
              )

          widget_receivers = """
                  <!-- SmartLab-GEO Home Screen Widget Receiver -->
                  <receiver
                      android:name=".DoorWidgetProvider"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/door_widget_info" />
                  </receiver>

                  <receiver
                      android:name="es.antonborri.home_widget.HomeWidgetBackgroundReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="es.antonborri.home_widget.action.BACKGROUND" />
                      </intent-filter>
                  </receiver>

                  <service
                      android:name="es.antonborri.home_widget.HomeWidgetBackgroundService"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="true" />
              </application>"""

          if "DoorWidgetProvider" not in content:
              content = content.replace("</application>", widget_receivers, 1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("AndroidManifest.xml updated successfully.")
          EOF

      - name: Install Dependencies & Build Release APK
        shell: bash
        run: |
          set -e
          if [ -d "smartlab-geo" ]; then
            cd smartlab-geo
          fi
          flutter pub get
          flutter build apk --release

          mkdir -p /tmp/apk_out
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/apk_out/SmartLab-GEO.apk

      - name: Upload SmartLab-GEO.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartLab-GEO-APK
          path: /tmp/apk_out/SmartLab-GEO.apk
          if-no-files-found: error

